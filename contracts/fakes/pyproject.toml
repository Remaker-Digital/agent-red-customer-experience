[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-red-core-fakes"
version = "0.1.0"
description = "Synthetic in-memory transport for the Agent Red core API contract"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28.1,<0.29", "jsonschema>=4.25,<5"]

[tool.setuptools.packages.find]
include = ["agent_red_core_fakes*"]

[tool.setuptools.package-data]
agent_red_core_fakes = ["openapi.json"]
