services:
  api:
    image: agent-red-evaluation-api:2.0.24
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      ENVIRONMENT: development
      USE_AGENT_CONTAINERS: "false"
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env.local
        required: false
    depends_on:
      - nats
      - redis
  test-host:
    profiles: [tests]
    build:
      context: .
      target: test-host
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      ENVIRONMENT: development
      TEST_TARGET_URL: http://api:8000
  nats:
    image: nats:2.10-alpine
    command: ["-js"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
