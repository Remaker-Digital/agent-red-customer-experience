# Vale configuration for Agent Red documentation
# https://vale.sh/docs/vale-ini/

StylesPath = .vale/styles
MinAlertLevel = warning

# Pinned releases (2026-10-10), so a new rule set cannot fail unchanged docs.
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip, https://github.com/vale-cli/alex/releases/download/v0.2.3/alex.zip, https://github.com/vale-cli/readability/releases/download/v0.2.0/Readability.zip

# Docusaurus markdown files
[docs/**/*.md]
BasedOnStyles = Vale, Google, write-good, alex, Readability, AgentRed

# Relax some Google rules that conflict with Docusaurus conventions
Google.Headings = NO
Google.Parens = NO
Google.Spacing = NO

# Readability thresholds
Readability.FleschKincaid = warning

# Ignore code blocks and frontmatter
BlockIgnores = (?s)^---\n.*?\n---\n
TokenIgnores = (`[^`]+`)

[docs/**/*.mdx]
BasedOnStyles = Vale, Google, write-good, alex, Readability, AgentRed
Google.Headings = NO
Google.Parens = NO
Google.Spacing = NO
Readability.FleschKincaid = warning
BlockIgnores = (?s)^---\n.*?\n---\n
TokenIgnores = (`[^`]+`)
